services:
  frontend:
    build: ./frontend
    container_name: three-tier-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - three-tier-net
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: three-tier-backend
    environment:
      DB_HOST: db
      DB_USER: appuser
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the environment}
      DB_NAME: companydb
    depends_on:
      db:
        condition: service_healthy
    networks:
      - three-tier-net
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: three-tier-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: companydb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - three-tier-net
    restart: unless-stopped

networks:
  three-tier-net:
    name: three-tier-net
    driver: bridge

volumes:
  mysql-data:
